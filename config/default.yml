project:
  title: Generational mortality change and longevity risk
  version: 1.0.0

paths:
  analysis: output

data:
  dx_file: data/HMD_Dx.RData
  ex_file: data/HMD_Ex.RData
  series_metadata: config/series_metadata.csv
  oecd_universe: config/longstanding_oecd_universe.csv
  year_min: 1930
  year_max: 2019
  age_min: 20
  age_max: 89
  age_step: 5
  period_step: 5
  cohort_step: 5
  min_calendar_years: 60
  min_quinquennial_periods: 12
  min_supported_cohorts: 12
  min_age_groups_per_supported_cohort: 4
  min_complete_cell_fraction: 0.95
  expected_selected_populations: 21

analysis:
  target_mask_start: 1925
  target_mask_end: 1935
  support_shift_cohorts: 5

model:
  # Shared age-period layer
  B_age: 8
  B_age_deviation: 5
  B_period: 6
  baseline_country_level_prior_sd: 0.35
  baseline_country_shape_prior_sd: 0.06
  baseline_global_rw2_prior_sd: 0.25
  drift_global_prior_sd: 0.18
  period_global_prior_sd: 0.10
  period_country_deviation_prior_sd: 0.035
  numerical_floor_phi: 0.05
  numerical_floor_baseline_rw2_sd: 0.005

  # Hierarchical change-point model
  B_regime: 6
  drift_country_deviation_prior_sd: 0.06
  regime_range_prior_sd: 0.30
  regime_global_shape_prior_sd: 0.12
  country_regime_level_prior_sd: 0.08
  switch_reference_year: 1900
  switch_center_prior_sd_intervals: 20
  switch_sd_prior_intervals: 8
  switch_sd_floor_intervals: 0.25

  # Smooth-cohort comparator
  B_cohort: 6
  drift_country_sd_prior: 0.06
  cohort_global_prior_sd: 0.18
  cohort_country_deviation_prior_sd: 0.05
  cohort_smoothness_sigma: 0.03

sampling:
  chains: 4
  parallel_chains: 4
  threads_per_chain: 2
  refresh: 20
  seed: 20260901
  save_cmdstan_csv: true

  changepoint_primary:
    iter_warmup: 600
    iter_sampling: 600
    adapt_delta: 0.93
    max_treedepth: 11

  changepoint_sensitivity:
    iter_warmup: 500
    iter_sampling: 500
    adapt_delta: 0.93
    max_treedepth: 11

  smooth:
    iter_warmup: 600
    iter_sampling: 600
    adapt_delta: 0.95
    initial_step_size: 0.03
    max_treedepth: 12

quality_control:
  bfmi_threshold: 0.30
  hard_rhat_threshold: 1.03
  hard_min_bulk_ess: 200
  hard_min_tail_ess: 200
  reporting_rhat_threshold: 1.01
  reporting_min_bulk_ess: 400
  reporting_min_tail_ess: 400
  max_treedepth_allowed: 0

runtime:
  prevent_nested_threading: true
  stan_reduce_grainsize: 1
  stan_smooth_reduce_grainsize: 64
  stan_threads_max_per_chain: 6
